<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1596 597" width="1596" height="597" role="img" aria-label="Data flow — one reply through Jev" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Data flow — one reply through Jev</title>
<desc>Interpret can now ask TypeSafe's Jev decision model, instead of AgentCore and Nova, to classify a free-text driver reply on critical_field. Jev picks one of 8 fixed options with a probability; Interpret still validates it with the same floor and routing. The change is off by default behind jev:enabled. It also fixes divert approval, which was never required because the check named the wrong action and never compared the fee to max_spend.</desc>
